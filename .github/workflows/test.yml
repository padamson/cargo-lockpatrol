name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  skill-version:
    name: Skill version guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The pre-commit hook of the same name is per-clone and opt-in, so a
    # hookless clone or a `--no-verify` commit would ship a skill edit
    # without the version bump installed consumers key their updates on.
    # Same script, run against the PR base or the tip before the push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute diff base
        id: base
        uses: ./.github/actions/diff-base

      # The script treats an unusable ref as an error; skipping when there
      # is nothing to compare against is this job's call, not the script's.
      - name: Check the skill version against the base
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No reachable base (first push, manual run, or rewritten history); nothing to compare."
            exit 0
          fi
          scripts/check-skill-version-bumped.sh --base "$BASE"

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"

      # If your crate uses `include_bytes!` against build-generated
      # artifacts (wasm pkgs, codegen output, etc.), stub them with
      # `touch` here so `cargo check` succeeds — the bytes aren't
      # exercised at compile time, only their existence on disk is.
      - name: Check compilation on MSRV
        run: cargo check --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # nextest does not run doctests, so this is its own step. The
      # crate keeps at least one doctest (the seed's `classify` has one),
      # which is what makes this step honest; delete the step if the
      # crate ever has none rather than running a no-op. The guard is on
      # the library target, not on doctests: `cargo test --doc` errors
      # outright on a bin-only crate, so the step goes with `src/lib.rs`.
      - name: Run doc-tests
        if: hashFiles('**/src/lib.rs') != ''
        run: cargo test --doc --workspace

      - name: Generate documentation
        run: cargo doc --no-deps --workspace

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # nextest's slow-timeout catches a hung test; this catches a hung
    # runner or a wedged tool install.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --verbose

      # `--profile ci` (.config/nextest.toml): retries on, so a retried
      # pass is reported FLAKY instead of hiding, and a longer slow-timeout.
      - name: Run tests
        run: cargo nextest run --workspace --profile ci

  # action.yml with a debug build and stub cargo and gh (tests/action). The
  # download and attestation check need a real release, so they don't run.
  action:
    name: Action self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TITLE: "Security: new dependency advisory detected"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: action

      - name: Build
        run: cargo build

      # From here on cargo and gh are the stubs.
      - name: Put the stubs in place
        run: |
          echo "$GITHUB_WORKSPACE/tests/action/bin" >> "$GITHUB_PATH"
          {
            echo "CARGO=$GITHUB_WORKSPACE/tests/action/cargo"
            echo "STUB_FIXTURES=$GITHUB_WORKSPACE/tests/fixtures/deny"
            echo "FAKE_GH_DIR=$RUNNER_TEMP/gh"
            echo "BIN=$GITHUB_WORKSPACE/target/debug/cargo-lockpatrol"
          } >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/gh"
          echo '{}' > "$RUNNER_TEMP/gh/issue.json"

      - name: "Gate: a clean check passes"
        id: gate_clean
        uses: ./
        with:
          binary: ${{ env.BIN }}
        env:
          STUB_ROOT: "clean:0"

      - name: "Gate: a finding fails the step"
        id: gate_finding
        continue-on-error: true
        uses: ./
        with:
          binary: ${{ env.BIN }}
        env:
          STUB_ROOT: "two-advisories:1"

      - name: "Gate: a stale ignore at warning level passes"
        id: gate_stale
        uses: ./
        with:
          binary: ${{ env.BIN }}
        env:
          STUB_ROOT: "unused-ignores-warn:0"

      # One tracked Cargo.lock here, so the entries are unused in every tree.
      - name: "Gate: a denied stale ignore fails the step"
        id: gate_denied
        continue-on-error: true
        uses: ./
        with:
          binary: ${{ env.BIN }}
        env:
          STUB_ROOT: "unused-ignores-deny:1"

      - name: Check the gate
        env:
          CLEAN: ${{ steps.gate_clean.outputs.result }}
          STALE: ${{ steps.gate_stale.outputs.result }}
          DENIED: ${{ steps.gate_denied.outcome }}/${{ steps.gate_denied.outputs.result }}/${{ steps.gate_denied.outputs.stale-ignore }}
          FINDING: ${{ steps.gate_finding.outcome }}/${{ steps.gate_finding.outputs.result }}
        run: |
          set -euo pipefail
          [ "$CLEAN" = clean ] || { echo "::error::clean gate gave '$CLEAN'"; exit 1; }
          [ "$STALE" = clean ] || { echo "::error::stale-ignore gate gave '$STALE'"; exit 1; }
          [ "$DENIED" = failure/clean/true ] || { echo "::error::denied stale-ignore gate gave '$DENIED'"; exit 1; }
          [ "$FINDING" = failure/finding ] || { echo "::error::finding gate gave '$FINDING'"; exit 1; }
          [ ! -e "$FAKE_GH_DIR/calls" ] || { echo "::error::the gate called gh:"; cat "$FAKE_GH_DIR/calls"; exit 1; }

      - name: "Monitor: a first finding opens the issue"
        uses: ./
        with:
          binary: ${{ env.BIN }}
          issue: "true"
        env:
          STUB_ROOT: "two-advisories:1"

      - name: Check that the issue was opened, and make it the open one
        run: |
          set -euo pipefail
          cat "$FAKE_GH_DIR/calls"
          grep -qx "issue create --title $TITLE --label security-advisory --body-file .*" "$FAKE_GH_DIR/calls"
          grep -q 'RUSTSEC-2021-0003' "$FAKE_GH_DIR/created.md"
          jq -n --rawfile body "$FAKE_GH_DIR/created.md" --arg title "$TITLE" \
            '{number: 7, title: $title, body: $body}' > "$FAKE_GH_DIR/issue.json"
          rm "$FAKE_GH_DIR/calls"

      # The loop guard: the same findings write nothing.
      - name: "Monitor: the same findings leave the issue alone"
        uses: ./
        with:
          binary: ${{ env.BIN }}
          issue: "true"
        env:
          STUB_ROOT: "two-advisories:1"

      - name: Check that only the list call was made
        run: |
          set -euo pipefail
          cat "$FAKE_GH_DIR/calls"
          [ "$(grep -cv '^issue list ' "$FAKE_GH_DIR/calls")" = 0 ]
          rm "$FAKE_GH_DIR/calls"

      - name: "Monitor: a resolved finding edits the issue and comments"
        uses: ./
        with:
          binary: ${{ env.BIN }}
          issue: "true"
        env:
          STUB_ROOT: "unmaintained:1"

      - name: Check the edit and the comment
        run: |
          set -euo pipefail
          cat "$FAKE_GH_DIR/calls"
          # The comment before the edit, so a failed comment leaves the old body.
          calls=$(grep -oE '^issue (comment|edit) 7 --body-file' "$FAKE_GH_DIR/calls" | cut -d' ' -f2 | paste -sd' ' -)
          [ "$calls" = "comment edit" ] || { echo "::error::expected a comment, then an edit; got '$calls'"; exit 1; }
          rm "$FAKE_GH_DIR/calls"

      - name: "Monitor: a clean check closes the issue"
        uses: ./
        with:
          binary: ${{ env.BIN }}
          issue: "true"
        env:
          STUB_ROOT: "clean:0"

      - name: Check the close
        run: |
          set -euo pipefail
          cat "$FAKE_GH_DIR/calls"
          grep -qx 'issue close 7 --comment .*' "$FAKE_GH_DIR/calls"
          rm "$FAKE_GH_DIR/calls"

      # The report is whole, so the issue is closed before the step fails.
      - name: "Monitor: a denied stale ignore closes the issue, then fails"
        id: monitor_denied
        continue-on-error: true
        uses: ./
        with:
          binary: ${{ env.BIN }}
          issue: "true"
        env:
          STUB_ROOT: "unused-ignores-deny:1"

      - name: Check the close and the failure
        env:
          DENIED: ${{ steps.monitor_denied.outcome }}/${{ steps.monitor_denied.outputs.result }}/${{ steps.monitor_denied.outputs.stale-ignore }}
        run: |
          set -euo pipefail
          [ "$DENIED" = failure/clean/true ] || { echo "::error::denied stale-ignore monitor gave '$DENIED'"; exit 1; }
          grep -qx 'issue close 7 --comment .*' "$FAKE_GH_DIR/calls"
          rm "$FAKE_GH_DIR/calls"

      - name: "Monitor: a broken check fails and touches nothing"
        id: monitor_broken
        continue-on-error: true
        uses: ./
        with:
          binary: ${{ env.BIN }}
          issue: "true"
        env:
          STUB_ROOT: "config-error:1"

      - name: Check the broken run
        env:
          BROKEN: ${{ steps.monitor_broken.outcome }}/${{ steps.monitor_broken.outputs.result }}
        run: |
          set -euo pipefail
          [ "$BROKEN" = failure/broken ] || { echo "::error::broken monitor gave '$BROKEN'"; exit 1; }
          [ ! -e "$FAKE_GH_DIR/calls" ] || { echo "::error::a broken check called gh:"; cat "$FAKE_GH_DIR/calls"; exit 1; }

      # A finding beside a broken tree is a partial report, which never
      # overwrites the open issue.
      - name: Make a repository with two lockfiles
        run: |
          set -euo pipefail
          two="$RUNNER_TEMP/two-trees"
          mkdir -p "$two/nested"
          touch "$two/deny.toml" "$two/Cargo.lock" "$two/nested/Cargo.lock"
          git -C "$two" init -q
          git -C "$two" add Cargo.lock nested/Cargo.lock
          echo "TWO=$two" >> "$GITHUB_ENV"

      - name: "Gate: a finding beside a broken tree fails the step"
        id: gate_both
        continue-on-error: true
        uses: ./
        with:
          binary: ${{ env.BIN }}
          working-directory: ${{ env.TWO }}
        env:
          STUB_ROOT: "two-advisories:1"
          STUB_NESTED: "config-error:1"

      - name: "Monitor: a partial report leaves the open issue alone and fails"
        id: monitor_both
        continue-on-error: true
        uses: ./
        with:
          binary: ${{ env.BIN }}
          working-directory: ${{ env.TWO }}
          issue: "true"
        env:
          STUB_ROOT: "two-advisories:1"
          STUB_NESTED: "config-error:1"

      - name: Check the partial runs
        env:
          GATE: ${{ steps.gate_both.outcome }}/${{ steps.gate_both.outputs.result }}
          MONITOR: ${{ steps.monitor_both.outcome }}/${{ steps.monitor_both.outputs.result }}
        run: |
          set -euo pipefail
          [ "$GATE" = failure/both ] || { echo "::error::partial gate gave '$GATE'"; exit 1; }
          [ "$MONITOR" = failure/both ] || { echo "::error::partial monitor gave '$MONITOR'"; exit 1; }
          cat "$FAKE_GH_DIR/calls"
          [ "$(grep -cv '^issue list ' "$FAKE_GH_DIR/calls")" = 0 ]
