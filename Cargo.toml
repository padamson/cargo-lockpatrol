[package]
name = "cargo-lockpatrol"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Check every tracked Cargo.lock for RustSec advisories with cargo-deny, and keep one GitHub issue current with what it finds"
repository = "https://github.com/padamson/cargo-lockpatrol"
authors = ["Paul Adamson"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
keywords = ["cargo-deny", "rustsec", "advisory", "security", "lockfile"]
include = ["/src", "/tests/*.rs", "/tests/common", "/tests/fixtures", "/scripts/annotate.sh", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[lints.rust]
# Nothing here has a reason to reach for unsafe. `deny` (not `forbid`)
# leaves a targeted `#[allow(unsafe_code)]` escape hatch if a future FFI
# edge genuinely needs one.
unsafe_code = "deny"

# The place for the clippy lints this crate turns on; the template imposes
# none. After converting to a workspace, move both tables to
# `[workspace.lints.*]` and give each crate `[lints] workspace = true`.
[lints.clippy]

[dependencies]
serde_json = "1.0.154"

[dev-dependencies]
# Scratch directories for the integration-test fixture in tests/common.
tempfile = "3"
